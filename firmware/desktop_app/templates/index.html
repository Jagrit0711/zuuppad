<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuupPad Configuration</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>ZuupPad Studio</h1>
            <p>Customize your macro experience.</p>
        </header>

        <main>
            <div class="pad-container">
                <div class="encoder-section">
                    <div class="encoder-knob" id="enc-btn" onclick="editKey('encoder', 'press')">
                        <span class="label">Knob Press</span>
                        <span class="val" id="val-enc-press">MUTE</span>
                    </div>
                    <div class="encoder-actions">
                        <div class="action-btn" onclick="editKey('encoder', 'ccw')">
                            <span class="label">↺ CCW</span>
                            <span class="val" id="val-enc-ccw">VOL_DOWN</span>
                        </div>
                        <div class="action-btn" onclick="editKey('encoder', 'cw')">
                            <span class="label">↻ CW</span>
                            <span class="val" id="val-enc-cw">VOL_UP</span>
                        </div>
                    </div>
                </div>

                <div class="matrix">
                    <div class="key" onclick="editKey('keys', 0, 0)">
                        <span class="val" id="val-key-0-0">1</span>
                    </div>
                    <div class="key" onclick="editKey('keys', 0, 1)">
                        <span class="val" id="val-key-0-1">2</span>
                    </div>
                    <div class="key" onclick="editKey('keys', 0, 2)">
                        <span class="val" id="val-key-0-2">3</span>
                    </div>
                    
                    <div class="key" onclick="editKey('keys', 1, 0)">
                        <span class="val" id="val-key-1-0">4</span>
                    </div>
                    <div class="key" onclick="editKey('keys', 1, 1)">
                        <span class="val" id="val-key-1-1">5</span>
                    </div>
                    <div class="key" onclick="editKey('keys', 1, 2)">
                        <span class="val" id="val-key-1-2">6</span>
                    </div>
                    
                    <div class="key" onclick="editKey('keys', 2, 0)">
                        <span class="val" id="val-key-2-0">7</span>
                    </div>
                    <div class="key" onclick="editKey('keys', 2, 1)">
                        <span class="val" id="val-key-2-1">8</span>
                    </div>
                    <div class="key" onclick="editKey('keys', 2, 2)">
                        <span class="val" id="val-key-2-2">9</span>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="primary-btn" onclick="saveConfig()">Sync to Macropad</button>
                <div id="status"></div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content glass">
            <h2>Assign Action</h2>
            <p id="modal-desc"></p>
            <input type="text" id="actionInput" placeholder="e.g. CTRL+C, F13, VOLUME_UP">
            <div class="modal-actions">
                <button onclick="closeModal()">Cancel</button>
                <button class="primary-btn" onclick="saveAction()">Save Action</button>
            </div>
        </div>
    </div>

    <script>
        let currentConfig = null;
        let editTarget = null; // { type: 'keys'|'encoder', row: 0, col: 0, or key: 'cw' }

        async function loadConfig() {
            const res = await fetch('/api/config');
            currentConfig = await res.json();
            renderConfig();
        }

        function renderConfig() {
            if(!currentConfig) return;
            
            // Render Encoder
            document.getElementById('val-enc-press').innerText = currentConfig.encoder.press;
            document.getElementById('val-enc-cw').innerText = currentConfig.encoder.cw;
            document.getElementById('val-enc-ccw').innerText = currentConfig.encoder.ccw;

            // Render Keys
            for(let r=0; r<3; r++){
                for(let c=0; c<3; c++){
                    document.getElementById(`val-key-${r}-${c}`).innerText = currentConfig.keys[r][c];
                }
            }
        }

        function editKey(type, arg1, arg2) {
            if(type === 'keys') {
                editTarget = { type: 'keys', row: arg1, col: arg2 };
                document.getElementById('modal-desc').innerText = `Editing Row ${arg1+1}, Col ${arg2+1}`;
                document.getElementById('actionInput').value = currentConfig.keys[arg1][arg2];
            } else {
                editTarget = { type: 'encoder', key: arg1 };
                document.getElementById('modal-desc').innerText = `Editing Encoder ${arg1.toUpperCase()}`;
                document.getElementById('actionInput').value = currentConfig.encoder[arg1];
            }
            
            document.getElementById('editModal').style.display = 'flex';
            document.getElementById('actionInput').focus();
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveAction() {
            const val = document.getElementById('actionInput').value;
            if(editTarget.type === 'keys') {
                currentConfig.keys[editTarget.row][editTarget.col] = val;
            } else {
                currentConfig.encoder[editTarget.key] = val;
            }
            renderConfig();
            closeModal();
        }

        async function saveConfig() {
            const btn = document.querySelector('.primary-btn');
            btn.innerText = "Syncing...";
            
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentConfig)
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    document.getElementById('status').innerText = "Synced Successfully!";
                    document.getElementById('status').style.color = "#4ade80";
                } else {
                    document.getElementById('status').innerText = "Error: " + data.message;
                    document.getElementById('status').style.color = "#f87171";
                }
            } catch(e) {
                document.getElementById('status').innerText = "Network Error!";
                document.getElementById('status').style.color = "#f87171";
            }
            
            setTimeout(() => {
                btn.innerText = "Sync to Macropad";
                setTimeout(() => document.getElementById('status').innerText = "", 3000);
            }, 1000);
        }

        // Init
        loadConfig();
    </script>
</body>
</html>
